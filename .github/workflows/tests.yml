name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system libraries for Qt (offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Core self-test (no GUI)
        run: python tests/smoke_test.py

      - name: Headless GUI self-test (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_smoke_test.py

  orange-addon-core:
    # Pure-logic tests for the Orange add-on (numpy/scipy only — the full
    # widget suite needs orange3 and is run locally / on release).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy
      - run: python orange-spectra/tests/test_core.py
